<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosk ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --t-blue:#5BCEFA; --t-pink:#F5A9B8; --t-white:#FFFFFF;
    --nb-yellow:#FCF434; --nb-purple:#9C59D1; --nb-black:#2C2C2C;
    --ink:#2b2340;
    --bar-h:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',sans-serif;color:var(--ink);background:#eaf7ff}

  .topbar{
    height:var(--bar-h);
    display:flex;
    align-items:center;
    gap:.5rem;
    padding:0 1rem;
    background:linear-gradient(90deg,var(--t-blue),var(--t-pink) 60%,var(--nb-yellow));
    box-shadow:0 2px 10px rgba(43,35,64,.2);
    position:relative;
    z-index:2;
  }
  .tab{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:1rem;
    text-decoration:none;
    color:var(--ink);
    background:rgba(255,255,255,.55);
    border:2px solid transparent;
    border-radius:999px;
    padding:.6rem 1.4rem;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .tab:hover{background:rgba(255,255,255,.8); transform:translateY(-1px)}
  .tab.active{
    background:#fffdfa;
    border-color:var(--nb-purple);
    box-shadow:0 3px 8px rgba(43,35,64,.15);
  }

  .frame-wrap{
    position:absolute;
    top:var(--bar-h);
    left:0;
    right:0;
    bottom:0;
  }
  iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#fffdfa;
  }
</style>
</head>
<body>

<nav class="topbar" role="navigation" aria-label="Kiosk sections">
  <a class="tab active" href="index.html" data-src="index.html">Name Change Station</a>
  <a class="tab" href="http://localhost:8000" data-src="http://localhost:8000">Understand Don't Assume</a>
</nav>

<div class="frame-wrap">
  <iframe id="viewer" src="index.html" title="Kiosk content"></iframe>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const viewer = document.getElementById('viewer');

  tabs.forEach(tab => {
    tab.addEventListener('click', e => {
      e.preventDefault();
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      viewer.src = tab.dataset.src;
    });
  });
</script>

</body>
</html>
